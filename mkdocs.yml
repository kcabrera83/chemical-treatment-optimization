site_name: Chemical Treatment Optimization
site_description: Inhibitor dosage optimization for scale, corrosion and paraffin control in production systems.
repo_url: https://github.com/kcabrera83/chemical-treatment-optimization
site_author: Kelvin J Cabrera

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top

nav:
  - Home: index.md
  - API Reference: api.md
  - Models: models.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
